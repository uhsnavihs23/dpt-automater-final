name: Daily UP Political Tracker

on:
  schedule:
    - cron: '00 12 * * *'  # 12:00 PM UTC = 5:30 PM IST (Subject to GitHub load delays)
  workflow_dispatch:       # allow manual trigger too

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    
    # Required to allow the GITHUB_TOKEN to read the workflow run history
    permissions:
      actions: read 

    steps:
      - name: Check if already run today
        id: check_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. If manually triggered, always proceed (bypass the check)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual execution triggered. Forcing run."
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. For cron jobs, check if a successful run already happened today (in IST)
          TODAY_IST=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          
          # Fetch the creation time of the last successful run for this specific workflow
          LATEST_RUN_TIME=$(gh run list --workflow "${{ github.workflow }}" --status success --limit 1 --json createdAt --jq '.[0].createdAt')
          
          if [ -n "$LATEST_RUN_TIME" ] && [ "$LATEST_RUN_TIME" != "null" ]; then
            # Convert the UTC timestamp of the latest run to IST
            LATEST_RUN_DATE_IST=$(TZ='Asia/Kolkata' date -d "$LATEST_RUN_TIME" +%Y-%m-%d)
            
            if [ "$TODAY_IST" == "$LATEST_RUN_DATE_IST" ]; then
              echo "A successful run already happened today ($TODAY_IST IST). Skipping this delayed cron run to prevent duplicates."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          echo "No successful run found for today. Proceeding."
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.check_run.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_run.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # ✅ Use Python 3.11 or later

      - name: Install dependencies
        if: steps.check_run.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
  
      - name: Run tracker
        if: steps.check_run.outputs.skip != 'true'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          DOC_TEMPLATE_ID: ${{ secrets.DOC_TEMPLATE_ID }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          
          # 6B Keys (8 Keys)
          GEMINI_KEY_6B_1: ${{ secrets.GEMINI_KEY_6B_1 }}
          GEMINI_KEY_6B_2: ${{ secrets.GEMINI_KEY_6B_2 }}
          GEMINI_KEY_6B_3: ${{ secrets.GEMINI_KEY_6B_3 }}
          GEMINI_KEY_6B_4: ${{ secrets.GEMINI_KEY_6B_4 }}
          GEMINI_KEY_6B_5: ${{ secrets.GEMINI_KEY_6B_5 }}
          GEMINI_KEY_6B_6: ${{ secrets.GEMINI_KEY_6B_6 }}
          GEMINI_KEY_6B_7: ${{ secrets.GEMINI_KEY_6B_7 }}
          GEMINI_KEY_6B_8: ${{ secrets.GEMINI_KEY_6B_8 }}
          
          # 6C Keys (3 Keys)
          GEMINI_KEY_6C_1: ${{ secrets.GEMINI_KEY_6C_1 }}
          GEMINI_KEY_6C_2: ${{ secrets.GEMINI_KEY_6C_2 }}
          GEMINI_KEY_6C_3: ${{ secrets.GEMINI_KEY_6C_3 }}
          
          # 6D Keys (12 Keys)
          GEMINI_KEY_6D_1: ${{ secrets.GEMINI_KEY_6D_1 }}
          GEMINI_KEY_6D_2: ${{ secrets.GEMINI_KEY_6D_2 }}
          GEMINI_KEY_6D_3: ${{ secrets.GEMINI_KEY_6D_3 }}
          GEMINI_KEY_6D_4: ${{ secrets.GEMINI_KEY_6D_4 }}
          GEMINI_KEY_6D_5: ${{ secrets.GEMINI_KEY_6D_5 }}
          GEMINI_KEY_6D_6: ${{ secrets.GEMINI_KEY_6D_6 }}
          GEMINI_KEY_6D_7: ${{ secrets.GEMINI_KEY_6D_7 }}
          GEMINI_KEY_6D_8: ${{ secrets.GEMINI_KEY_6D_8 }}
          GEMINI_KEY_6D_9: ${{ secrets.GEMINI_KEY_6D_9 }}
          GEMINI_KEY_6D_10: ${{ secrets.GEMINI_KEY_6D_10 }}
          GEMINI_KEY_6D_11: ${{ secrets.GEMINI_KEY_6D_11 }}
          GEMINI_KEY_6D_12: ${{ secrets.GEMINI_KEY_6D_12 }}
          
          # DOC Keys (3 Keys)
          GEMINI_KEY_DOC_1: ${{ secrets.GEMINI_KEY_DOC_1 }}
          GEMINI_KEY_DOC_2: ${{ secrets.GEMINI_KEY_DOC_2 }}
          GEMINI_KEY_DOC_3: ${{ secrets.GEMINI_KEY_DOC_3 }}
          
        run: python run.py
