name: Daily UP Political Tracker

on:
  schedule:
    - cron: '20 12 * * *'  # 12:20 PM UTC = 5:50 PM IST
  workflow_dispatch:       # allow manual trigger too

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client google-auth google-auth-httplib2 \
            google-auth-oauthlib google-api-python-client google-generativeai requests pytz

      - name: Run tracker
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          DOC_TEMPLATE_ID: ${{ secrets.DOC_TEMPLATE_ID }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          GEMINI_KEY_6B_1: ${{ secrets.GEMINI_KEY_6B_1 }}
          GEMINI_KEY_6B_2: ${{ secrets.GEMINI_KEY_6B_2 }}
          GEMINI_KEY_6B_3: ${{ secrets.GEMINI_KEY_6B_3 }}
          GEMINI_KEY_6B_4: ${{ secrets.GEMINI_KEY_6B_4 }}
          GEMINI_KEY_6C_1: ${{ secrets.GEMINI_KEY_6C_1 }}
          GEMINI_KEY_6C_2: ${{ secrets.GEMINI_KEY_6C_2 }}
          GEMINI_KEY_6D_1: ${{ secrets.GEMINI_KEY_6D_1 }}
          GEMINI_KEY_6D_2: ${{ secrets.GEMINI_KEY_6D_2 }}
          GEMINI_KEY_6D_3: ${{ secrets.GEMINI_KEY_6D_3 }}
          GEMINI_KEY_6D_4: ${{ secrets.GEMINI_KEY_6D_4 }}
          GEMINI_KEY_6D_5: ${{ secrets.GEMINI_KEY_6D_5 }}
          GEMINI_KEY_6D_6: ${{ secrets.GEMINI_KEY_6D_6 }}
          GEMINI_KEY_6D_7: ${{ secrets.GEMINI_KEY_6D_7 }}
          GEMINI_KEY_DOC_1: ${{ secrets.GEMINI_KEY_DOC_1 }}
          GEMINI_KEY_DOC_2: ${{ secrets.GEMINI_KEY_DOC_2 }}
          GEMINI_KEY_DOC_3: ${{ secrets.GEMINI_KEY_DOC_3 }}
        run: python run.py
